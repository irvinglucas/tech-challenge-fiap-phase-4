quarkus.application.name=feedback-api
quarkus.log.level=INFO

# === HTTP runtime (used in dev mode; in production the Cloud Functions
# Framework dispatches requests through the same JAX-RS app via
# entry-point=io.quarkus.gcp.functions.http.QuarkusHttpFunction). ===
quarkus.http.port=8080

# === OpenAPI ===
quarkus.smallrye-openapi.info-title=FIAP Feedback Platform API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Receives student evaluations \
  for the FIAP Phase 4 Tech Challenge.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# === Health checks ===
quarkus.smallrye-health.root-path=/q/health

# === Domain configuration (consumed by adapters in the common module) ===
feedback.firestore.collection=evaluations
feedback.pubsub.urgent-topic=urgent-feedback

# === Google Cloud configuration ===
# In Cloud Functions runtime, GOOGLE_CLOUD_PROJECT is set automatically.
quarkus.google.cloud.project-id=${GOOGLE_CLOUD_PROJECT:fiap-feedback-local}

# === Local emulator support (only active in dev mode) ===
%dev.quarkus.google.cloud.firestore.host-override=${FIRESTORE_EMULATOR_HOST:localhost:8085}
%dev.quarkus.google.cloud.pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:localhost:8086}
%dev.quarkus.google.cloud.pubsub.use-emulator-credentials=true

# === Structured JSON logging for Cloud Logging ===
quarkus.log.console.json=true
quarkus.log.console.json.exception-output-type=formatted

# === Mailer is not used by this module; it's only the API.
quarkus.mailer.mock=true
