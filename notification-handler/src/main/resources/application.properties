quarkus.application.name=notification-handler
quarkus.log.level=INFO

# Cloud Function bean name (matches @Named on the handler class)
quarkus.google-cloud-functions.function=notification-handler

# === Domain configuration ===
feedback.firestore.collection=evaluations
feedback.pubsub.urgent-topic=urgent-feedback
# Email recipient — provisioned from Secret Manager at deploy time.
feedback.admin-email=${ADMIN_EMAIL:admin@example.com}

# === Google Cloud configuration ===
quarkus.google.cloud.project-id=${GOOGLE_CLOUD_PROJECT:fiap-feedback-local}

# === Local emulator support (only active in dev mode) ===
# use-emulator-credentials=true: skip the Application Default Credentials
# lookup at startup and use NoCredentialsProvider — without this the
# Quarkiverse GcpCredentialProducer fails locally because no ADC file exists.
%dev.quarkus.google.cloud.project-id=${GOOGLE_CLOUD_PROJECT:fiap-feedback-local}
%dev.quarkus.google.cloud.firestore.host-override=${FIRESTORE_EMULATOR_HOST:localhost:8085}
%dev.quarkus.google.cloud.firestore.use-emulator-credentials=true
%dev.quarkus.google.cloud.pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:localhost:8086}
%dev.quarkus.google.cloud.pubsub.use-emulator-credentials=true

# === Gmail SMTP (port 587 STARTTLS) via Quarkus Mailer ===
quarkus.mailer.from=${GMAIL_USERNAME:noreply@example.com}
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.auth-methods=LOGIN PLAIN
quarkus.mailer.username=${GMAIL_USERNAME:noreply@example.com}
quarkus.mailer.password=${GMAIL_APP_PASSWORD:}
%dev.quarkus.mailer.mock=true

# === Structured JSON logging for Cloud Logging ===
quarkus.log.console.json=true
quarkus.log.console.json.exception-output-type=formatted
