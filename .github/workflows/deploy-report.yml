name: Deploy weekly-report

on:
  push:
    branches: [master]
    paths:
      - 'common/**'
      - 'weekly-report/**'
      - 'pom.xml'
      - '.github/workflows/deploy-report.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
  FUNCTION_NAME: weekly-report
  SERVICE_ACCOUNT: report-sa
  SCHEDULER_SA: scheduler-invoker-sa
  JAVA_VERSION: '21'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build weekly-report JAR
        run: ./mvnw -B -pl weekly-report -am package -DskipTests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.10
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2.1.4
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy ${{ env.FUNCTION_NAME }}
        run: |
          set -e
          gcloud functions deploy "${FUNCTION_NAME}" \
            --gen2 \
            --runtime=java21 \
            --region="${REGION}" \
            --source=weekly-report/target/deployment \
            --entry-point=io.quarkus.gcp.functions.QuarkusHttpFunction \
            --trigger-http \
            --no-allow-unauthenticated \
            --service-account="${SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --memory=512Mi \
            --cpu=1 \
            --timeout=540s \
            --max-instances=1 \
            --set-secrets="GMAIL_USERNAME=gmail-username:latest,GMAIL_APP_PASSWORD=gmail-app-password:latest,ADMIN_EMAIL=admin-email:latest" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"

      - name: Grant Scheduler invoke permission
        run: |
          gcloud run services add-iam-policy-binding "${FUNCTION_NAME}" \
            --region="${REGION}" \
            --member="serviceAccount:${SCHEDULER_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role=roles/run.invoker \
            --condition=None \
            --quiet

      - name: Ensure Cloud Scheduler job
        run: |
          URL=$(gcloud functions describe "${FUNCTION_NAME}" --gen2 \
            --region="${REGION}" --format='value(serviceConfig.uri)')
          JOB=weekly-report-job
          if gcloud scheduler jobs describe "${JOB}" --location="${REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${JOB}" \
              --location="${REGION}" \
              --schedule='0 11 * * 1' --time-zone='UTC' \
              --http-method=POST --uri="${URL}" \
              --oidc-service-account-email="${SCHEDULER_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
              --oidc-token-audience="${URL}" \
              --quiet
          else
            gcloud scheduler jobs create http "${JOB}" \
              --location="${REGION}" \
              --schedule='0 11 * * 1' --time-zone='UTC' \
              --http-method=POST --uri="${URL}" \
              --oidc-service-account-email="${SCHEDULER_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
              --oidc-token-audience="${URL}" \
              --quiet
          fi
          echo "::notice::weekly-report scheduled (Mon 11:00 UTC = 08:00 BRT). Manual trigger: gcloud scheduler jobs run ${JOB} --location=${REGION}"
